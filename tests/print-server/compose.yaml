# The print server's access rules, tested from outside: see access.py.
# Networks without a route anywhere; the printer is a socket nobody answers.
#
#   docker compose -f tests/print-server/compose.yaml build server
#   docker compose -f tests/print-server/compose.yaml up -d server open
#   docker compose -f tests/print-server/compose.yaml run --rm clients
#   docker compose -f tests/print-server/compose.yaml run --rm host
#   docker compose -f tests/print-server/compose.yaml down
name: hl3070cw-access-test

services:
  server:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    image: ${SERVER_IMAGE:-hl3070cw-access-test:local}
    pull_policy: never
    init: true
    read_only: true
    tmpfs: [/etc/cups, /run, /tmp, /var/spool/cups, /var/cache/cups, /var/log/cups, /usr/share/hl3070cw-native]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL, NET_BIND_SERVICE]
    security_opt: [no-new-privileges=true]
    environment:
      PRINTER_DRIVER: postscript # needs nothing of Brother's
      PRINTER_URI: socket://127.0.0.1:9
      ALLOW_FROM: 172.30.61.0/24
      WEB_FROM: 172.30.62.0/24
    networks:
      allowed: {ipv4_address: 172.30.61.10}
      proxy: {ipv4_address: 172.30.62.10}
      outside: {ipv4_address: 172.30.63.10}

  # ALLOW_FROM "*": everyone
  open:
    image: ${SERVER_IMAGE:-hl3070cw-access-test:local}
    pull_policy: never
    init: true
    environment:
      PRINTER_DRIVER: postscript
      PRINTER_URI: socket://127.0.0.1:9
      ALLOW_FROM: "*"
    networks:
      outside: {ipv4_address: 172.30.63.11}

  # one container with an address in each network
  clients:
    image: &python python:3.13-slim@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90
    volumes: [".:/t:ro"]
    command: [python, -I, /t/access.py, clients]
    networks:
      allowed: {ipv4_address: 172.30.61.20}
      proxy: {ipv4_address: 172.30.62.20}
      outside: {ipv4_address: 172.30.63.20}

  # a process on the server's machine, as with network_mode: host
  host:
    image: *python
    volumes: [".:/t:ro"]
    command: [python, -I, /t/access.py, host]
    network_mode: service:server

networks:
  allowed: {internal: true, ipam: {config: [{subnet: 172.30.61.0/24}]}}
  proxy: {internal: true, ipam: {config: [{subnet: 172.30.62.0/24}]}}
  outside: {internal: true, ipam: {config: [{subnet: 172.30.63.0/24}]}}
