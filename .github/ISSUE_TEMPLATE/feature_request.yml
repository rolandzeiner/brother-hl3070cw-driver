name: Feature request
description: An idea for something new, or a way to make something better.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe what you're trying to achieve, not only the feature. That makes it easier to find the best solution.
      placeholder: I want to print envelopes from my iPhone …
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Your idea for a solution.

  - type: textarea
    id: brother
    attributes:
      label: How does Brother's driver do it?
      description: If Brother's own driver has this option, what is it called and where is it? Screenshots are welcome.
