name: CI

# Builds the driver on macOS and Linux and runs everything that needs nothing
# of Brother's: `make check` (sanitizer build on made-up data), `make lint` and
# the installer package. `make test` compares with Brother's own output and needs
# Brother's data files, so it only runs on a Mac that has Brother's driver.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, self-test, package
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build (arm64 + x86_64)
        run: |
          make
          # one at a time: lipo takes a second name after -verify_arch for another input file
          for arch in arm64 x86_64; do lipo build/rastertohl3070cw -verify_arch "$arch"; done
          codesign --verify --strict --verbose build/rastertohl3070cw
      - name: Self-test with sanitizers
        run: make check
      - name: Self-test as root (owner and mode checks)
        run: sudo python3 -I tools/selftest.py --lines 100
      - name: Installer package
        run: |
          make pkg
          pkgutil --payload-files build/pkg/*.pkg
      - name: Install, print, update and uninstall
        run: tests/macos-package.sh build/pkg/*.pkg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: driver-macos
          path: build/pkg/*.pkg
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}, build and self-test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install CUPS headers and shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libcups2-dev shellcheck
      - name: Build
        run: |
          make
          build/rastertohl3070cw --version
      - name: Self-test with sanitizers
        run: |
          # Ubuntu 24.04 randomises mmap more than AddressSanitizer allows
          sudo sysctl -w vm.mmap_rnd_bits=28
          make check
      - name: Self-test as root (owner and mode checks)
        run: sudo python3 -I tools/selftest.py --lines 100
      - name: Linux installer
        run: |
          bash -n install-linux.sh
          shellcheck install-linux.sh

  linux-package:
    name: Linux ${{ matrix.arch }}, release package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build on Debian 12 (glibc 2.36, for older distributions too)
        # debian:12 as of 2026-11-05, for both processors; Dependabot does not move this pin
        env:
          BUILDER: debian:12@sha256:268fb24c39bca92d326dd83ea3abebe4a3f7751c804ffef23bb6d857dd343ff8
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$BUILDER" sh -ec '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends gcc libc6-dev make libcups2-dev >/dev/null
            make dist'
      - name: Install, print and uninstall on Debian and Ubuntu
        run: |
          package=$(cd build/dist && ls -- *.tar.gz)
          for image in debian:12 debian:13 ubuntu:24.04; do
            echo "::group::$image"
            docker run --rm -v "$PWD:/src:ro" "$image" bash /src/tests/linux-package.sh "/src/build/dist/$package"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: driver-linux-${{ matrix.arch }}
          path: build/dist/*.tar.gz
          if-no-files-found: error

  attest:
    name: Attest the release files
    # main's builds are the ones releases are made of
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, linux-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: driver-*
          path: release
          merge-multiple: true
      # attest-build-provenance is a wrapper around this action since its v4
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*

  lint:
    name: Lint
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck and LLVM (for clang-tidy)
        run: brew install --quiet shellcheck llvm
      - name: Lint
        run: make lint
